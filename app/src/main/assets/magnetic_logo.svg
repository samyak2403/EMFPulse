<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <!-- Magnetic Field Loops / Flux Waves -->
    <path d="M 38,28 C 45,14 75,14 82,28" fill="none" stroke="#F99797" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
    <path d="M 32,20 C 42,4 78,4 88,20" fill="none" stroke="#58A6FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6" />
    <path d="M 26,12 C 38,-4 82,-4 94,12" fill="none" stroke="#F99797" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.35" />

    <!-- Magnet U-Body -->
    <path d="M 26,52 L 26,82 C 26,102 94,102 94,82 L 94,52 L 76,52 L 76,80 C 76,90 44,90 44,80 L 44,52 Z" fill="#27272A" stroke="#3F3F46" stroke-width="1.5" />

    <!-- North Pole (Left Cap - Coral / Rose) -->
    <path d="M 26,36 C 26,33 28,31 31,31 L 39,31 C 42,31 44,33 44,36 L 44,52 L 26,52 Z" fill="#F99797" />

    <!-- South Pole (Right Cap - Blue) -->
    <path d="M 76,36 C 76,33 78,31 81,31 L 89,31 C 92,31 94,33 94,36 L 94,52 L 76,52 Z" fill="#339AF0" />

    <!-- Letter 'N' -->
    <path d="M 32,46 L 32,37 L 38,46 L 38,37" fill="none" stroke="#18181B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter 'S' -->
    <path d="M 88,38 C 88,36 82,36 82,40 C 82,44 88,44 88,48 C 88,52 82,52 82,50" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Sensor Indicator Dot -->
    <circle cx="60" cy="68" r="3" fill="#FCC419" />
</svg>

